{% extends "base.html" %}
{% set hide_footer = true %}

{% block title %}Crear cuenta — NOMA{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <a href="{{ url_for('shop.index') }}" class="auth-card__logo">NOMA</a>
    <p class="auth-card__tagline">Crea tu cuenta</p>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label class="form-label" for="username">Nombre de usuario</label>
        <input class="form-input" type="text" id="username" name="username"
               placeholder="tu_nombre" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico</label>
        <input class="form-input" type="email" id="email" name="email"
               placeholder="tu@correo.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-input" type="password" id="password" name="password"
               placeholder="Mínimo 6 caracteres" required minlength="6">
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm">Confirmar contraseña</label>
        <input class="form-input" type="password" id="confirm" name="confirm"
               placeholder="Repite tu contraseña" required>
      </div>
      <button type="submit" class="btn btn--primary" style="width:100%;padding:0.85rem;">
        Crear cuenta
      </button>
    </form>

    <div class="divider"></div>
    <p style="text-align:center;font-size:0.88rem;color:var(--mid);">
      ¿Ya tienes cuenta?
      <a href="{{ url_for('auth.login') }}" style="color:var(--gold);">Iniciar sesión</a>
    </p>
  </div>
</div>
{% endblock %}
